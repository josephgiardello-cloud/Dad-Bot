name: Semantic PGVector

on:
  push:
  pull_request:

jobs:
  semantic-pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dadbot
          POSTGRES_USER: dadbot
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD != '' && secrets.POSTGRES_PASSWORD || 'dadbot_ci_ephemeral' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dadbot -d dadbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --locked --extra dev --extra service --extra mcp
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Provision restricted integration-test role and pgvector
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD != '' && secrets.POSTGRES_PASSWORD || 'dadbot_ci_ephemeral' }}
        run: |
          psql --host=127.0.0.1 --username=dadbot --dbname=dadbot \
            --set=ON_ERROR_STOP=1 --set=test_password="$PGPASSWORD" <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE ROLE dadbot_test LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD :'test_password';
          GRANT USAGE, CREATE ON SCHEMA public TO dadbot_test;
          SQL

      - name: Run live PGVector integration test
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD != '' && secrets.POSTGRES_PASSWORD || 'dadbot_ci_ephemeral' }}
          DADBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=dadbot user=dadbot_test
          DADBOT_TENANT_ID: t1_aaaaaaaaaaaaaaaaaaaaaaaaaa
        run: python -m pytest -q tests/test_semantic_pgvector_integration.py

      - name: Run deterministic memory quality checks
        run: >-
          python -m pytest -q
          tests/eval/test_memory_benchmark.py
          tests/eval/test_memory_long_horizon.py
          tests/eval/test_memory_no_answer.py
